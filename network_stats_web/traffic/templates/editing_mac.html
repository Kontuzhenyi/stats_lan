<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детали MAC-адреса</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .mac-details {
            max-width: 600px;
            margin: 2rem auto;
        }
        .back-link {
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container mac-details">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">Редактирование MAC-адреса</h2>
                <p class="card-text"><strong>MAC-адрес:</strong> {{ mac|upper }}</p>
                <!-- Форма для редактирования -->
                <form method="post" class="d-flex align-items-end gap-2 mb-3">
                    {% csrf_token %}
                    <div class="flex-grow-1">
                        <label for="description" class="form-label">Описание</label>
                        {{ form.description }}
                        {% if form.errors %}
                            <div class="alert alert-danger mt-2">{{ form.errors }}</div>
                        {% endif %}
                    </div>
                    <div>
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                    </div>
                </form>
                <!-- Форма для удаления и кнопка Назад -->
                <div class="d-flex justify-content-between mt-2">
                    <form method="post" action="{% url 'delete_mac' mac=mac %}" onsubmit="return confirm('Вы уверены, что хотите удалить эту запись?');">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Удалить</button>
                    </form>
                    <div>
                        <a href="{% url 'add_mac' %}" class="btn btn-outline-secondary">Назад</a>
                    </div>
                </div> 
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
